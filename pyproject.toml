[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-weave"
version = "0.1.0"
description = "Git-backed, host-namespaced knowledge exchange for independent Hermes agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Hermes Weave contributors"}]
dependencies = []
keywords = ["hermes", "agent", "skills", "git", "sync"]

[project.scripts]
weave = "hermes_weave.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
